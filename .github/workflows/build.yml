name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      # versionName in app/build.gradle.kts decides the release: bump it to publish a new one.
      - name: Prepare release files
        id: version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          APK="timecode-burner-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK"
          # The in-app updater refuses any APK that doesn't match this checksum.
          (cd dist && sha256sum "$APK" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # Release notes: releases/v<version>.md if present, else a default text.
          if [ -f "releases/v${VERSION}.md" ]; then
            cp "releases/v${VERSION}.md" notes.md
          else
            echo "Brennt einen laufenden Timecode (MM:SS:mmm) unten links ins Video." > notes.md
          fi
          printf '\n\n---\n**Installieren:** APK herunterladen, öffnen und die Installation erlauben. Ab Android 10. Ab Version 1.1 geht das auch direkt in der App unter Einstellungen > Updates.\n' >> notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: timecode-burner-apk
          path: dist/*

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Timecode Burner ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          overwrite_files: true
          make_latest: true
          body_path: notes.md
