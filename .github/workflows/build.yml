name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      # versionName in app/build.gradle.kts decides the release: bump it to publish a new one.
      - name: Read version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "timecode-burner-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: timecode-burner-apk
          path: timecode-burner-*.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Timecode Burner ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: timecode-burner-*.apk
          overwrite_files: true
          body: |
            Brennt einen laufenden Timecode (MM:SS:mmm) unten links ins Video.

            **Installieren:** APK unten herunterladen, öffnen und Installation aus unbekannten Quellen erlauben. Ab Android 10.
